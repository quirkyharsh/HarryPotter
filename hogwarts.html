<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Hogwarts: Your Journey Begins</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b1a;--bg2:#0d1430;--gold:#e8b75a;--gold2:#ffe3a0;--ink:#f3ead6;--mut:#9aa3c2;--glass:rgba(16,24,56,.62);--line:rgba(232,183,90,.25);--hc:#e8b75a;box-sizing:border-box}
:root[data-theme=light]{}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif;overflow-x:hidden;padding-top:env(safe-area-inset-top,0px)}
h1,h2,h3,.serif{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;letter-spacing:.01em}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:1}
.stage{position:fixed;inset:0;z-index:2;overflow-y:auto;overflow-x:hidden}
.bg{position:absolute;inset:0;background-size:cover;background-position:center;z-index:-1}
.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,11,26,.25),rgba(7,11,26,.9))}
.cta{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#2a1a02;font-weight:600;padding:14px 30px;border-radius:99px;box-shadow:0 0 30px rgba(232,183,90,.45);transition:.25s}
.cta:hover{transform:translateY(-2px);box-shadow:0 0 50px rgba(232,183,90,.7)}
.ghost{border:1px solid var(--line);padding:9px 18px;border-radius:99px;color:var(--gold2);transition:.2s}.ghost:hover{background:rgba(232,183,90,.12)}
.glass{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px}
.center{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 20px;gap:18px}
.fade{animation:fade 1s both}@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.title{font-size:clamp(54px,13vw,150px);line-height:.9;letter-spacing:.12em;background:linear-gradient(180deg,#fff3cf,var(--gold) 60%,#a97a2a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 30px rgba(232,183,90,.4))}
.sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(20px,3.4vw,30px);color:var(--gold2)}
input.name{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:99px;padding:12px 22px;color:var(--ink);text-align:center;font-size:16px;width:260px}
/* quiz */
.q{max-width:760px;width:100%}.q h2{font-size:clamp(28px,5vw,44px);margin-bottom:20px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.opt{padding:20px 16px;text-align:left;border-radius:16px;border:1px solid var(--line);background:var(--glass);transition:.25s}
.opt:hover{transform:translateY(-4px);border-color:var(--gold);box-shadow:0 8px 30px rgba(232,183,90,.2)}.opt b{font-size:26px;display:block}
.bar{height:4px;background:rgba(255,255,255,.1);border-radius:9px;width:min(520px,80%);overflow:hidden}.bar i{display:block;height:100%;background:var(--gold);transition:width .6s}
.reveal .crest{font-size:110px;animation:pop 1.4s cubic-bezier(.2,1.4,.3,1) both;filter:drop-shadow(0 0 40px var(--hc))}
@keyframes pop{from{transform:scale(0) rotate(-40deg);opacity:0}to{transform:none;opacity:1}}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.chip{padding:4px 12px;border-radius:99px;border:1px solid var(--hc);color:var(--hc);font-size:13px}
/* app */
#app{display:none;min-height:100%;padding:76px 24px 100px;max-width:1180px;margin:auto}
nav{position:fixed;z-index:5;top:0;left:0;right:0;display:flex;align-items:center;gap:4px;padding:10px 20px;background:linear-gradient(180deg,rgba(7,11,26,.95),rgba(7,11,26,.6));backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:calc(10px + env(safe-area-inset-top,0px))}
nav .logo{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:22px;color:var(--gold2);margin-right:auto;letter-spacing:.14em}
nav button{padding:8px 14px;border-radius:99px;color:var(--mut);display:flex;gap:6px;align-items:center}nav button.on{color:var(--gold2);background:rgba(232,183,90,.14)}
.stats{display:flex;gap:10px;font-size:13px;margin-left:12px}.stats span{padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.07)}
@media(max-width:820px){nav{top:auto;bottom:0;border-top:1px solid var(--line);border-bottom:0;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around}nav .logo,.stats{display:none}nav button{flex-direction:column;gap:0;padding:6px 8px;font-size:11px}nav button b{font-size:19px}nav button span{display:block}#app{padding-top:24px}}
@media(min-width:821px){nav button b{display:none}}
.hero{position:relative;border-radius:24px;overflow:hidden;padding:44px 32px;min-height:280px;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;border:1px solid var(--line)}
.hero h1{font-size:clamp(34px,6vw,64px)}.hero .bg{z-index:0}.hero>*{position:relative;z-index:1}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;margin-top:18px}.pad{padding:22px}
h2.sec{font-size:32px;margin:34px 0 10px;color:var(--gold2)}
.meter{height:8px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden;margin:8px 0}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:9px;transition:width .8s}
.todo{display:flex;gap:14px;align-items:center;padding:14px 0;border-top:1px dashed var(--line)}.todo:first-of-type{border-top:0}.todo b{font-size:24px}.todo div{flex:1}.todo small{color:var(--mut);display:block}
.map{position:relative;border-radius:24px;overflow:hidden;border:1px solid var(--line);aspect-ratio:3/2;background-size:cover;background-position:center}
.map::after{content:"";position:absolute;inset:0;background:rgba(7,11,26,.45)}
.pin{position:absolute;z-index:2;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;border:2px solid var(--gold);background:rgba(7,11,26,.75);font-size:20px;transition:.25s;animation:pulse 2.4s infinite}
.pin.done{background:var(--gold);animation:none;box-shadow:0 0 20px var(--gold)}.pin:hover,.pin.sel{transform:translate(-50%,-50%) scale(1.25)}
@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(232,183,90,0)}0%{box-shadow:0 0 0 0 rgba(232,183,90,.6)}}
.split{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}@media(max-width:820px){.split{grid-template-columns:1fr}}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.tabs .ghost.on{background:var(--gold);color:#2a1a02}
.item{position:relative;padding:20px;border-radius:18px;border:1px solid var(--line);background:var(--glass);transition:.3s;overflow:hidden}
.item.locked{filter:saturate(.2) brightness(.7)}.item .em{font-size:44px}.item.got{border-color:var(--gold);box-shadow:inset 0 0 40px rgba(232,183,90,.12)}
.q li{list-style:none}
.chat{display:flex;flex-direction:column;height:min(70vh,640px)}.msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.m{max-width:85%;padding:12px 16px;border-radius:16px;white-space:pre-line;animation:fade .4s both}.m.a{background:rgba(232,183,90,.1);border:1px solid var(--line);font-family:'Cormorant Garamond',serif;font-size:19px;line-height:1.35;align-self:flex-start}.m.u{background:rgba(255,255,255,.1);align-self:flex-end}
.orb{width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--gold) 45%,#7a4d10);box-shadow:0 0 30px var(--gold);animation:float 3s ease-in-out infinite;display:grid;place-items:center;font-size:26px}@keyframes float{50%{transform:translateY(-6px)}}
.dots span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);margin:0 2px;animation:bl 1s infinite}.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}@keyframes bl{50%{opacity:.2}}
.suggest{display:flex;gap:8px;flex-wrap:wrap;padding:0 18px 10px}.suggest button{font-size:13px;padding:6px 12px}
.cinput{display:flex;gap:8px;padding:14px;border-top:1px solid var(--line)}.cinput input{flex:1;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:99px;padding:10px 18px;color:var(--ink);font-size:16px}
.toasts{position:fixed;z-index:50;top:70px;right:16px;display:flex;flex-direction:column;gap:8px;pointer-events:none}@media(max-width:820px){.toasts{top:16px}}
.toast{background:linear-gradient(135deg,#2b1e06,#4a3410);border:1px solid var(--gold);padding:12px 18px;border-radius:14px;animation:tin .5s both,tout .5s 3.2s forwards;box-shadow:0 0 30px rgba(232,183,90,.4)}
@keyframes tin{from{transform:translateX(60px);opacity:0}}@keyframes tout{to{opacity:0;transform:translateY(-10px)}}
.modal{position:fixed;inset:0;z-index:40;background:rgba(3,5,14,.8);display:grid;place-items:center;padding:20px;animation:fade .3s both}.modal .glass{max-width:460px;padding:30px;text-align:center}
.lb{display:flex;align-items:center;gap:12px;margin:10px 0}.lb .meter{flex:1;margin:0}.lb.me b{color:var(--gold2)}
.badge{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:50%;border:1px solid var(--line);font-size:28px;margin:4px;background:rgba(255,255,255,.04)}.badge.on{border-color:var(--gold);background:rgba(232,183,90,.15);box-shadow:0 0 18px rgba(232,183,90,.4)}.badge:not(.on){filter:grayscale(1) opacity(.4)}
.fact{color:var(--mut);font-size:14px}ul.f{padding-left:18px}.tag{font-size:12px;color:var(--mut)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

body{background:var(--sky,var(--bg));transition:background 2s}
:root[data-t=morning]{--sky:linear-gradient(#2a2f55,#5b4a52 55%,#7a5a3c) fixed}
:root[data-t=dusk]{--sky:linear-gradient(#1d1640,#6a2e45 60%,#b5603a) fixed}
:root[data-t=night]{--sky:#050816}
.tl{position:relative;padding-left:34px}.tl:before{content:"";position:absolute;left:14px;top:18px;bottom:18px;width:2px;background:var(--line)}
.tl .st{position:relative;padding:10px 0}.tl .st:before{content:"";position:absolute;left:-26px;top:18px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--gold)}
.tl .st.done:before{background:var(--gold);box-shadow:0 0 12px var(--gold)}.tm{font-family:'Cormorant Garamond',serif;color:var(--gold2);font-size:22px;margin-right:8px}
.pin.lock{opacity:.55;border-style:dashed;animation:none}.pin.sec{border-color:#b98cff;background:#2a1650;box-shadow:0 0 22px #b98cff}.pin.sec.done{background:var(--gold)}
.disc h1{font-size:clamp(28px,6vw,44px);color:var(--gold2);animation:glow 2s infinite alternate;margin:8px 0}@keyframes glow{from{text-shadow:0 0 8px var(--gold)}to{text-shadow:0 0 38px var(--gold)}}
.rw{display:flex;gap:26px;justify-content:center;font-size:26px;margin:14px 0}.rw b{color:var(--gold2)}.disc p{margin:6px 0}
.flash{animation:fl 1.2s}@keyframes fl{30%{background:rgba(232,183,90,.3);transform:scale(1.03)}}
.pass{border-radius:20px;border:2px solid var(--gold);background:linear-gradient(135deg,#2a1d0c,#14100a);padding:26px;box-shadow:0 0 40px rgba(232,183,90,.2)}
.stamp{display:inline-grid;place-items:center;width:62px;height:62px;border:2px dashed var(--gold);border-radius:50%;margin:4px;font-size:24px;transform:rotate(-8deg)}.stamp.no{opacity:.2;filter:grayscale(1)}
.pg{animation:fade .5s both}.demo{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;padding:10px 16px;width:max-content;max-width:94vw}
@media(min-width:821px){.demo{bottom:20px}}

:root{--ink:#2b1d0e;--mut:#6b5636;--gold:#8a5a1c;--gold2:#4a2c0e;--glass:linear-gradient(#f4e8c8,#e8d5a5);--line:rgba(90,60,20,.55)}
body{background:radial-gradient(circle at 15% 25%,rgba(120,80,30,.22),transparent 40%),radial-gradient(circle at 85% 75%,rgba(120,80,30,.25),transparent 45%),#d9c79d!important;color:var(--ink);font:17px/1.5 'IM Fell English',Georgia,serif}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:3;mix-blend-mode:multiply;background:var(--tint,transparent);transition:background 2s}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:3;box-shadow:inset 0 0 130px rgba(50,28,6,.75)}
:root[data-t=dusk]{--tint:rgba(220,120,60,.35)}:root[data-t=night]{--tint:rgba(40,60,140,.45)}
h1,h2,h3,.serif,.sub,.tm,.title,nav .logo{font-family:'IM Fell English SC',Georgia,serif!important}
.title{background:linear-gradient(#4a2c0e,#7a4d1a);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(1px 2px 0 rgba(255,240,200,.6))}
.sub,.tm,h2.sec{color:#5a3510}
#fx{filter:sepia(1) brightness(.45) saturate(2)}
.bg{filter:sepia(.85) contrast(.95)}.bg::after{background:radial-gradient(ellipse at center,rgba(240,226,190,.8),rgba(160,120,60,.92))}
.glass{background:var(--glass);backdrop-filter:none;-webkit-backdrop-filter:none;border:3px double #6b4a1e;border-radius:6px;box-shadow:0 6px 16px rgba(40,20,0,.4);position:relative;color:var(--ink)}
.glass::before,.glass::after{content:"";position:absolute;top:6px;width:9px;height:9px;border-radius:50%;background:radial-gradient(#e6c566,#6b4a1e);box-shadow:0 1px 2px #000;z-index:2}.glass::before{left:6px}.glass::after{right:6px}
.cta{background:linear-gradient(#5a3a18,#2b1a0a);color:#f6dc92;border:1px solid #c9a24a;border-radius:4px;box-shadow:0 3px 0 #1a0f04,0 6px 12px rgba(40,20,0,.5);letter-spacing:.04em}
.cta:hover{box-shadow:0 5px 0 #1a0f04,0 10px 16px rgba(40,20,0,.5)}
.ghost{border-radius:4px;border:1.5px solid #6b4a1e;color:var(--gold2)}.ghost:hover{background:rgba(90,60,20,.15)}.tabs .ghost.on{background:#4a2c0e;color:#f6dc92}
nav{background:linear-gradient(#3a2512,#24160a);border-bottom:3px double #c9a24a}nav .logo{color:#f6dc92}nav button{color:#d8c08a}nav button.on{color:#ffe3a0;background:rgba(246,220,146,.16)}.stats span{background:rgba(246,220,146,.14);color:#f6dc92}
.hero,.item,.opt,.pass,.map{border:3px double #6b4a1e;border-radius:6px}.hero .bg::after{background:linear-gradient(180deg,rgba(240,226,190,.3),rgba(230,210,160,.92))}
.item,.opt{background:var(--glass)}.map::after{background:rgba(120,80,30,.2)}.map{filter:sepia(.4)}
.pass{background:linear-gradient(135deg,#f1e2bd,#dcc690)}.chip{color:#2b1d0e;border-color:#2b1d0e;background:rgba(255,255,255,.3)}
.meter,.bar{background:rgba(60,40,10,.22)}.meter i,.bar i{background:linear-gradient(90deg,#6b4a1e,#b8862e)}
input.name,.cinput input{background:rgba(255,255,255,.55);color:var(--ink);border-radius:4px;border:1.5px solid #6b4a1e}
.modal{background:rgba(30,18,6,.78)}.toast{background:#f1e2bd;color:var(--ink);border:2px solid #4a2c0e}
.m.a{font-family:Caveat,cursive;font-size:23px;background:rgba(255,255,255,.35)}.m.u{background:rgba(90,60,20,.18)}
.disc h1{color:#7a1f14;animation:none;text-shadow:1px 1px 0 rgba(255,240,200,.7)}.rw b{color:#7a1f14}
.glass svg>rect{fill:#e8d6a6}.glass svg line{stroke:#7a5628}.glass svg circle[fill="#0d1430"]{fill:#efe0b8}.glass svg text{fill:#2b1d0e}.glass svg .rt{stroke:#b3261e}.glass svg .here{stroke:#1d5fa8}
.pin{background:#efe0b8;color:#000}.pin.sec{background:#6a3aa0}
.prof{display:flex;gap:14px;align-items:center;margin:0 0 18px;max-width:780px;width:100%;text-align:left}
.scroll{background:linear-gradient(#f4e8c8,#e8d5a5);border:2px solid #6b4a1e;border-radius:6px 24px 6px 24px;padding:12px 18px;box-shadow:0 4px 12px rgba(40,20,0,.35);color:var(--ink)}
.scroll p{font-family:Caveat,cursive;font-size:23px;line-height:1.15}
.stamp2{display:inline-block;font-family:'Special Elite',monospace;font-size:12px;letter-spacing:.06em;color:#9b2a1c;border:1.5px solid #9b2a1c;padding:1px 8px;margin-bottom:4px;transform:rotate(-1.5deg)}
.pols{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:10px 0 18px}.pol{background:#f7f0dc;padding:8px 8px 4px;box-shadow:0 6px 14px rgba(40,20,0,.45);width:132px;margin:0}.pol img{width:100%;height:150px;object-fit:cover;filter:sepia(.45);display:block}.pol figcaption{font-family:Caveat,cursive;text-align:center;font-size:20px;color:#3b2410}
.gear{position:fixed;z-index:3;pointer-events:none;font-size:190px;color:#3b2410;opacity:.13;animation:spin 70s linear infinite}.g1{bottom:-60px;left:-50px}.g2{top:70px;right:-70px;animation-direction:reverse}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:820px){.prof{flex-direction:column;text-align:center}.pol{width:104px}.pol img{height:120px}}
</style><link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Special+Elite&family=Caveat:wght@500;700&display=swap" rel="stylesheet"></head><body>

const api={
 reward(xp,pts,why){S.xp+=xp;S.pts+=pts;S.log.unshift(why);S.log=S.log.slice(0,6);toast(`✨ +${xp} XP · +${pts} House Points<br><small>${why}</small>`);api.check();save();paint()},
 check(){QUESTS.forEach(q=>{if(!S.quests.includes(q.id)&&q.ok(S)){S.quests.push(q.id);S.xp+=50;S.pts+=20;setTimeout(()=>toast(`📜 Quest complete: ${q.n}<br><small>+50 XP · +20 House Points</small>`),500)}});
  ACH.forEach(a=>{if(!S.ach.includes(a.id)&&a.ok(S)){S.ach.push(a.id);setTimeout(()=>modal(`<div style="font-size:70px">${a.e}</div><h2>Achievement unlocked</h2><p class="sub">${a.n}</p><br><button class="cta" onclick="closeM()">Wonderful</button>`),900)}})},
 explore(id){if(S.locs.includes(id))return toast("You have already discovered this place.");const l=LOCS.find(x=>x.id==id);S.locs.push(id);burst();api.reward(40,15,"Discovered "+l.n)},
 challenge(id,i){const s=SUBS.find(x=>x.id==id);if(S.subs.includes(id))return;if(i==s.a){S.subs.push(id);api.reward(60,25,"Mastered "+s.n+" challenge")}else toast("Not quite. Read the facts and try again.")},

 progress(){return Math.round((S.locs.length/9+S.subs.length/7+S.disc.length/WORLD.length+S.quests.length/6)/4*100)},
 board(){const b={...BASE};b[S.house]+=S.pts;return Object.entries(b).sort((a,b)=>b[1]-a[1])},
 today(){const H=HOUSES[S.house],o=[];const nl=H.locs.find(l=>!S.locs.includes(l))||LOCS.find(l=>!S.locs.includes(l.id))?.id;
  if(nl){const l=LOCS.find(x=>x.id==nl);o.push({e:l.e,t:"Explore the "+l.n,s:"Fits your "+H.n+" nature · +40 XP",go:"map",loc:nl})}

function aria(q){q=q.toLowerCase();const H=HOUSES[S.house],un=LOCS.filter(l=>!S.locs.includes(l.id));
 const find=(a)=>a.find(x=>q.includes(x.n.toLowerCase().split(" ")[0]));
 if(/library|book/.test(q))return"The Library is on the castle's west side: climb the spiral staircase beyond the Charms corridor. Whisper, and mind the Restricted Section rope."+(S.locs.includes("lib")?"":"\nYou haven't been inside yet. Open the Map and explore it for a quest reward.");
 if(/potion/.test(q))return"Potions is taught in the dungeon, down the stairs beyond the Great Hall. Professor Snape expects exact measurements. "+(S.subs.includes("potions")?"You've already passed its challenge.":"Try the Potions challenge under Subjects.");
 for(const h of Object.values(HOUSES))if(q.includes(h.n.toLowerCase()))return`${h.n} is known for being ${h.traits.join(", ").toLowerCase()}. ${h.blurb}`+(h==H?" That's your house, "+S.name+".":"");
 if(/creature|beast/.test(q)){const n=WORLD.filter(w=>w.t=="creature"&&!S.disc.includes(w.id));return"Hogwarts shelters hippogriffs, thestrals, phoenixes and nifflers. "+(n.length?`You still haven't met the ${n[0].n}. Look in the Magical World tab.`:"You've found every creature so far!")}
 if(/today|do here|what can/.test(q)){const t=api.today();return"Here is what I'd do today:\n"+t.map((x,i)=>`${i+1}. ${x.t}`).join("\n")}
 if(/next|explore|class|recommend|should/.test(q)){const l=un.find(l=>H.locs.includes(l.id))||un[0];const s=SUBS.find(x=>H.subs.includes(x.id)&&!S.subs.includes(x.id));return l?`As a ${H.n} with ${S.locs.length} places discovered, I'd head to the ${l.n} next.${s?` After that, try ${s.n} with ${s.p}.`:""}`:`You've seen every location! Finish your subject challenges: ${SUBS.filter(x=>!S.subs.includes(x.id)).map(x=>x.n).join(", ")||"all done"}.`}
 const sub=find(SUBS);if(sub)return`${sub.n}: ${sub.d} Taught by ${sub.p} at the ${LOCS.find(l=>l.id==sub.loc).n}. ${sub.fact}`;
 const loc=find(LOCS);if(loc)return`${loc.n}: ${loc.d} ${loc.does}`;
 return"I can help with where places are, what to study, house traditions, creatures, and what to do next. Try asking: \"What should I explore next?\""}

const cv=$("#fx"),cx=cv.getContext("2d");let P=[];
function rs(){cv.width=innerWidth;cv.height=innerHeight}rs();addEventListener("resize",rs);
for(let i=0;i<60;i++)P.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.8+.4,v:Math.random()*.4+.1,a:Math.random()})
function burst(){for(let i=0;i<50;i++)P.push({x:innerWidth/2,y:innerHeight/2,r:Math.random()*2.5+1,vx:(Math.random()-.5)*10,vy:(Math.random()-.5)*10,l:60,a:1})}
(function loop(){cx.clearRect(0,0,cv.width,cv.height);P=P.filter(p=>!p.l||p.l>0);P.forEach(p=>{if(p.l){p.x+=p.vx;p.y+=p.vy;p.l--;p.a=p.l/60}else{p.y-=p.v;p.a=.3+Math.abs(Math.sin(Date.now()/900+p.x))*.6;if(p.y<0)p.y=cv.height}cx.fillStyle=`rgba(255,222,140,${p.a})`;cx.shadowBlur=10;cx.shadowColor="#e8b75a";cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill()});requestAnimationFrame(loop)})();
